version: 2

# Dependabot config for charter. Based on the canonical npm/TypeScript config
# in forgesworn/.github/templates/dependabot/dependabot.npm.yml, but NOT a
# straight sync: charter is also two cargo workspaces, and there is no cargo
# template to sync from. Re-running the propagator over this file will drop
# the cargo block below and orphan every Rust dependency again.
#
# Tiering:
#   patch + minor  -> grouped, auto-merged on green CI
#   major          -> individual PR, manual review
#   TS / Node / framework majors -> ignored here, upgraded deliberately

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # DELIBERATE local deviation from the forgesworn template (weekly):
      # monthly while the repo is private — every dependabot PR burns paid CI
      # minutes. Restore weekly when the repos go public and minutes are free.
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-minor:
        dependency-type: production
        update-types: ["patch", "minor"]
      dev-minor:
        dependency-type: development
        update-types: ["patch", "minor"]
    ignore:
      # nostr-tools >=2.23.11 corrupts the pool's in-use counter under enablePing
      # and idle-closes relays with reconnection disabled; repos pin 2.23.9.
      # Remove once nbd-wtf/nostr-tools#539 is fixed and pins are lifted.
      - dependency-name: "nostr-tools"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Rust. charter is two cargo workspaces: /core (the shared engine) and
  # /linux (the daemon and tray). Neither was managed at all after this file
  # was synced from the npm template, which is why sixteen cargo PRs opened in
  # July then sat untouched while main moved on underneath them.
  - package-ecosystem: cargo
    directories:
      - "/core"
      - "/linux"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The RustCrypto crates share a `digest` version and CANNOT be bumped one
      # at a time. sha2 0.11 pulls digest 0.11 while hmac 0.12 is still on
      # digest 0.10, and the build dies on "expected trait ... found trait".
      # They move as a unit or not at all, so this group takes majors too.
      rustcrypto:
        patterns:
          - "sha2"
          - "sha3"
          - "hkdf"
          - "hmac"
          - "digest"
          - "chacha20*"
          - "cipher"
          - "aead"
          - "crypto-common"
          - "block-buffer"
          - "universal-hash"
          - "poly1305"
        update-types: ["patch", "minor", "major"]
      cargo-minor:
        update-types: ["patch", "minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor:
        update-types: ["patch", "minor"]
