name: Deploy MyCharter

# Mirrors signet-app's deploy: build the static PWA and rsync dist/ to the
# Hetzner box, where nginx serves charter.mysignet.app. MyCharter has no
# private @forgesworn deps, so no read-PAT dance is needed.

on:
  push:
    branches: [main]
    paths:
      - "apps/charter-app/**"
      - ".github/workflows/deploy-charter-app.yml"
  workflow_dispatch: {} # allow a manual deploy from the Actions tab

# One deploy at a time, and a burst of pushes collapses to "the one running
# plus the newest queued" — never cancel a deploy mid-rsync.
concurrency:
  group: deploy-charter-app
  cancel-in-progress: false

# Least privilege — only reads the repo and deploys over SSH (matches signet-app).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/charter-app
    steps:
      # Actions pinned to commit SHA (supply-chain integrity), same as signet-app.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/charter-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build # tsc --noEmit && vite build -> dist/

      - name: Deploy to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host keys are pinned (DEPLOY_KNOWN_HOSTS), never ssh-keyscanned per run:
          # TOFU could redirect an `rsync --delete`, and a failed scan aborts under
          # `set -e` with no diagnostic.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # NOTE: confirm this docroot matches the nginx vhost root the sysadmin
          # set up for charter.mysignet.app. --delete keeps it a clean mirror, so
          # the target MUST be a directory dedicated to MyCharter.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ deploy@"$DEPLOY_HOST":/opt/charter-app/
