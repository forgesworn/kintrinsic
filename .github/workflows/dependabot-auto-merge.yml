name: Dependabot auto-merge

# Auto-merges dependabot PRs for patch/minor bumps once required checks pass.
# Majors are never auto-merged -- they open a normal PR for deliberate review.
# Security advisories always open their own PR and follow the same gate.
#
# Synced from forgesworn/.github/templates/dependabot/dependabot-auto-merge.yml.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # `gh pr merge --auto` defers to branch protection, and this org is on the
      # free plan where branch protection does not exist for private repos. With
      # nothing to defer to, --auto merges the moment the PR is mergeable, which
      # is immediately -- CI never enters into it. On 2026-09-08 that landed eight
      # cargo PRs with four red builds each and left main unable to compile.
      #
      # So wait for the checks explicitly instead. Everything except this job's
      # own check run must finish, and all of it must pass, before we merge.
      - name: Wait for CI, then merge patch/minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          SELF: ${{ github.job }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Poll rather than `gh pr checks --watch`: --watch also waits on THIS
          # job, which can never finish while it is waiting on itself.
          for _ in $(seq 1 120); do
            checks=$(gh pr checks "$PR_URL" --json name,state 2>/dev/null || echo '[]')
            others=$(jq -c --arg self "$SELF" '[.[] | select(.name != $self)]' <<<"$checks")
            pending=$(jq '[.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS")] | length' <<<"$others")
            failed=$(jq -r '[.[] | select(.state == "FAILURE" or .state == "TIMED_OUT" or .state == "CANCELLED" or .state == "ACTION_REQUIRED") | .name] | join(", ")' <<<"$others")
            if [ -n "$failed" ]; then
              echo "::error::not merging, these checks failed: $failed"
              exit 1
            fi
            if [ "$pending" = "0" ] && [ "$(jq 'length' <<<"$others")" != "0" ]; then
              echo "all checks green, merging"
              gh pr merge --squash --delete-branch "$PR_URL"
              exit 0
            fi
            sleep 30
          done
          echo "::error::timed out waiting for checks; not merging"
          exit 1
