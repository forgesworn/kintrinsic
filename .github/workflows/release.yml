name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    with:
      tag: ${{ inputs.tag || '' }}
      # npm requires a public source repo for provenance publishes, and anvil
      # mandates provenance; this repo is private, so skip the real npm push
      # (build, reproducibility gate, and GitHub Release still run). Drop this
      # when the repo goes public.
      dry-run: "true"
