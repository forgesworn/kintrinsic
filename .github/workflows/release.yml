name: release

# The root npm SDK (@forgesworn/charter) ONLY. `release: published` also
# fires for the ward-v*/guardian-v*/linux-v* GitHub Releases that
# release-artifacts.yml drafts and a maintainer publishes with
# publish-release.mjs --from-draft — those are Android/Linux artifacts, not
# npm packages, and must never reach anvil's npm publish job. SDK tags are
# always `v<semver>` (anvil's own convention), which none of the three
# artifact prefixes can ever match, but the exclusion is spelled out anyway
# so a future prefix can't slip through by accident.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: |
      startsWith(github.event.release.tag_name || inputs.tag, 'v') &&
      !startsWith(github.event.release.tag_name || inputs.tag, 'ward-v') &&
      !startsWith(github.event.release.tag_name || inputs.tag, 'guardian-v') &&
      !startsWith(github.event.release.tag_name || inputs.tag, 'linux-v')
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    with:
      tag: ${{ inputs.tag || '' }}
      # This repo is public; npm publishing is simply CLOSED for now (a
      # separate decision from repo visibility) — dry-run keeps the build,
      # reproducibility gate and GitHub Release running without pushing to
      # npm. Flip this once npm publishing opens up.
      dry-run: "true"
