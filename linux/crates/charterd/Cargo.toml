[package]
name = "charterd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["mock"]
mock = [
    "charter-sys/mock",
    "charter-verify/mock",
    "charter-transport/mock",
    "charter-ipc/mock",
    "charter-spine/mock",
]
real = [
    "charter-sys/real",
    "charter-verify/real",
    "charter-transport/real",
    "charter-ipc/real",
    "charter-spine/real",
    "dep:zbus",
    "dep:reqwest",
]

[dependencies]
charter-primitives = { workspace = true }
charter-spine = { workspace = true, default-features = false }
charter-crypto = { workspace = true }
charter-proto = { workspace = true }
charter-schedule = { workspace = true }
charter-content = { workspace = true }
charter-webpolicy = { workspace = true }
charter-verify = { workspace = true, default-features = false }
charter-transport = { workspace = true, default-features = false }
charter-sys = { workspace = true, default-features = false }
charter-ipc = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The lock panel's child-facing schedule lines ("back at 07:00 tomorrow",
# the week's hours) need local-time formatting in the child's tz.
chrono = { workspace = true }
chrono-tz = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
# `charter-xclients` asks the X SERVER who owns each window (XRes
# QueryClientIds) instead of believing `_NET_WM_PID`, which any client on the
# display can delete or rewrite. Pure-Rust wire protocol, no libxcb/Xlib C deps
# — same version and style as charter-lock, so it builds on the headless gate.
x11rb = { version = "0.13", default-features = false, features = ["res", "dpms"] }
# real-only: the live org.forgesworn.Charter1 zbus server.
zbus = { version = "4.4", optional = true, default-features = false, features = [
    "tokio",
] }
# NOT optional: the exec.allow confused-deputy guard opens every candidate with
# `openat2(2)` under RESOLVE_BENEATH in EVERY build, mock included — the guard's
# containment rule is not a thing we compile out. (Also real-only: SIGTERM a
# ward's blocked per-app processes, POSIX kill(2).)
libc = { version = "0.2" }
# The guardian↔machine NIP-44 conversation key is held here for the lifetime of
# the daemon (it answers every offline unlock), so it is held in `Zeroizing` and
# wiped on drop rather than left in freed heap.
zeroize = { workspace = true }
# real-only (D2): download release-event-named deb blobs from Blossom mirrors.
# rustls-only, reusing the TLS stack the relay websocket already links — the
# first (and only) HTTP client in the linux tree.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls-webpki-roots",
] }

[dev-dependencies]
charter-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true }
