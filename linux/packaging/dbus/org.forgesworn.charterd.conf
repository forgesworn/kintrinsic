<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System-bus policy for charterd. Only root owns the well-known name; any
     local user may call the unprivileged "submit request / query status /
     time-left" surface on org.forgesworn.Charter1. -->
<busconfig>
  <policy user="root">
    <allow own="org.forgesworn.charterd"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.forgesworn.charterd"
           send_interface="org.forgesworn.Charter1"/>
    <allow send_destination="org.forgesworn.charterd"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.forgesworn.charterd"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="org.forgesworn.charterd"/>
  </policy>
</busconfig>
