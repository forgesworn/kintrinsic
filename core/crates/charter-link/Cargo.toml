[package]
name = "charter-link"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The ward client and guardian listener (tokio sockets). The protocol
# definitions, codec and signatures compile without it.
net = ["dep:tokio"]

[dependencies]
charter-primitives = { workspace = true }
charter-crypto = { workspace = true }
charter-verify = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time", "sync", "rt"] }
